version: 2
updates:
  # The published package: one PR per dependency.
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
    versioning-strategy: increase-if-necessary
    labels:
      - needs-triage

  # The examples and the workflow actions: one grouped PR a month each.
  - package-ecosystem: pub
    directory: /example
    schedule:
      interval: monthly
    groups:
      example:
        patterns:
          - "*"
    labels:
      - needs-triage

  - package-ecosystem: pub
    directory: /example_cli
    schedule:
      interval: monthly
    groups:
      example-cli:
        patterns:
          - "*"
    labels:
      - needs-triage

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"
    labels:
      - needs-triage
